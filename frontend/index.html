<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Tickets — SupportCRM</title>
  <meta name="description" content="View, search, and manage all customer support tickets in SupportCRM." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .sidebar-link { @apply flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-all duration-200 text-sm font-medium; }
    .sidebar-link.active { @apply text-white bg-blue-600/80; }
    .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold; }
    .skeleton { @apply animate-pulse bg-slate-700 rounded; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex">

  <!-- ─── Sidebar ─────────────────────────────────────────────────────── -->
  <aside class="w-64 min-h-screen bg-[#0f0f1a] border-r border-white/5 flex flex-col fixed top-0 left-0 z-30">
    <div class="p-6 border-b border-white/5">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </div>
        <span class="text-lg font-bold text-white">SupportCRM</span>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1">
      <a href="index.html" class="sidebar-link active" id="nav-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        All Tickets
      </a>
      <a href="create.html" class="sidebar-link" id="nav-new">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        New Ticket
      </a>
      <a href="analytics.html" class="sidebar-link" id="nav-analytics">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        Analytics
      </a>
    </nav>
    <div class="p-4 border-t border-white/5">
      <p class="text-xs text-slate-500">SupportCRM v1.0</p>
    </div>
  </aside>

  <!-- ─── Main Content ─────────────────────────────────────────────────── -->
  <main class="ml-64 flex-1 flex flex-col min-h-screen">
    <!-- Top bar -->
    <header class="sticky top-0 z-20 bg-slate-900/80 backdrop-blur border-b border-white/5 px-8 py-4 flex items-center gap-4">
      <div class="flex-1 relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="Search tickets by ID, name, subject..."
          class="w-full bg-slate-800 border border-white/10 rounded-lg pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>
      <select
        id="status-filter"
        class="bg-slate-800 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition cursor-pointer"
      >
        <option value="">All Statuses</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
      <a href="create.html" id="btn-new-ticket"
        class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 shadow-lg shadow-blue-900/40 whitespace-nowrap">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        New Ticket
      </a>
    </header>

    <div class="p-8 flex-1">
      <!-- Page title -->
      <div class="mb-6 flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-white">All Tickets</h1>
          <p class="text-slate-400 text-sm mt-1" id="ticket-count">Loading...</p>
        </div>
        <button id="refresh-btn" onclick="loadTickets()" class="flex items-center gap-2 text-slate-400 hover:text-white text-sm transition-colors">
          <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Refresh
        </button>
      </div>

      <!-- Table container -->
      <div class="bg-slate-800/50 border border-white/5 rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-white/5 text-slate-400 text-xs uppercase tracking-wider">
                <th class="px-6 py-4 text-left font-semibold">Ticket ID</th>
                <th class="px-6 py-4 text-left font-semibold">Customer</th>
                <th class="px-6 py-4 text-left font-semibold">Subject</th>
                <th class="px-6 py-4 text-left font-semibold">Status</th>
                <th class="px-6 py-4 text-left font-semibold">Priority</th>
                <th class="px-6 py-4 text-left font-semibold">Category</th>
                <th class="px-6 py-4 text-left font-semibold">Created</th>
                <th class="px-6 py-4 text-left font-semibold">Action</th>
              </tr>
            </thead>
            <tbody id="tickets-tbody">
              <!-- Skeleton rows shown while loading -->
              <tr class="border-b border-white/5">
                <td colspan="8" class="px-6 py-12 text-center text-slate-500">
                  <div class="flex items-center justify-center gap-3">
                    <svg class="w-5 h-5 animate-spin text-blue-500" fill="none" viewBox="0 0 24 24">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
                    </svg>
                    <span>Loading tickets...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'https://support-crm-production-e44f.up.railway.app';
    let debounceTimer = null;

    // ── Badge helpers ────────────────────────────────────────────────────────
    function statusBadge(status) {
      const map = {
        'Open':        'bg-blue-500/20 text-blue-400 ring-1 ring-blue-500/30',
        'In Progress': 'bg-yellow-500/20 text-yellow-400 ring-1 ring-yellow-500/30',
        'Closed':      'bg-green-500/20 text-green-400 ring-1 ring-green-500/30',
      };
      const cls = map[status] || 'bg-slate-500/20 text-slate-400 ring-1 ring-slate-500/30';
      return `<span class="badge ${cls}">${status}</span>`;
    }

    function priorityBadge(priority) {
      const map = {
        'Critical':   'bg-red-500/20 text-red-400 ring-1 ring-red-500/30',
        'High':       'bg-orange-500/20 text-orange-400 ring-1 ring-orange-500/30',
        'Medium':     'bg-yellow-500/20 text-yellow-400 ring-1 ring-yellow-500/30',
        'Low':        'bg-green-500/20 text-green-400 ring-1 ring-green-500/30',
        'Unassigned': 'bg-slate-500/20 text-slate-400 ring-1 ring-slate-500/30',
      };
      const cls = map[priority] || 'bg-slate-500/20 text-slate-400';
      return `<span class="badge ${cls}">${priority}</span>`;
    }

    function formatDate(isoStr) {
      if (!isoStr) return '—';
      const d = new Date(isoStr);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // ── Render tickets ───────────────────────────────────────────────────────
    function renderTickets(tickets) {
      const tbody = document.getElementById('tickets-tbody');
      document.getElementById('ticket-count').textContent =
        `${tickets.length} ticket${tickets.length !== 1 ? 's' : ''} found`;

      if (tickets.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="px-6 py-20 text-center">
              <div class="flex flex-col items-center gap-3 text-slate-500">
                <svg class="w-12 h-12 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                <p class="text-lg font-medium text-slate-400">No tickets found</p>
                <p class="text-sm">Try adjusting your search or filter.</p>
              </div>
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = tickets.map((t, i) => `
        <tr class="border-b border-white/5 hover:bg-white/[0.03] transition-colors duration-150 group" style="animation: fadeIn 0.2s ease ${i * 0.03}s both">
          <td class="px-6 py-4">
            <span class="font-mono text-xs bg-slate-700 text-blue-400 px-2.5 py-1 rounded-md font-semibold">${t.ticket_id}</span>
          </td>
          <td class="px-6 py-4 font-medium text-slate-200">${escapeHtml(t.customer_name)}</td>
          <td class="px-6 py-4 text-slate-300 max-w-xs truncate">${escapeHtml(t.subject)}</td>
          <td class="px-6 py-4">${statusBadge(t.status)}</td>
          <td class="px-6 py-4">${priorityBadge(t.priority)}</td>
          <td class="px-6 py-4 text-slate-400">${escapeHtml(t.category)}</td>
          <td class="px-6 py-4 text-slate-400 text-xs">${formatDate(t.created_at)}</td>
          <td class="px-6 py-4">
            <a href="ticket.html?id=${encodeURIComponent(t.ticket_id)}"
               class="text-blue-400 hover:text-blue-300 text-xs font-semibold border border-blue-500/30 hover:border-blue-400/50 px-3 py-1.5 rounded-lg transition-all duration-200 bg-blue-500/10 hover:bg-blue-500/20">
              View →
            </a>
          </td>
        </tr>`).join('');
    }

    // ── Fetch tickets ─────────────────────────────────────────────────────────
    async function loadTickets() {
      const search = document.getElementById('search-input').value.trim();
      const status = document.getElementById('status-filter').value;

      const params = new URLSearchParams();
      if (search) params.set('search', search);
      if (status) params.set('status', status);

      const tbody = document.getElementById('tickets-tbody');
      tbody.innerHTML = `
        <tr><td colspan="8" class="px-6 py-12 text-center text-slate-500">
          <div class="flex items-center justify-center gap-3">
            <svg class="w-5 h-5 animate-spin text-blue-500" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
            </svg><span>Loading...</span>
          </div>
        </td></tr>`;

      try {
        const res = await fetch(`${API_BASE}/api/tickets?${params.toString()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderTickets(data);
      } catch (err) {
        tbody.innerHTML = `
          <tr><td colspan="8" class="px-6 py-12 text-center text-red-400">
            <p class="font-medium">Failed to load tickets</p>
            <p class="text-sm text-slate-500 mt-1">${err.message}</p>
          </td></tr>`;
        document.getElementById('ticket-count').textContent = 'Error loading tickets';
      }
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(str || ''));
      return d.innerHTML;
    }

    // ── Event listeners ───────────────────────────────────────────────────────
    document.getElementById('search-input').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadTickets, 300);
    });

    document.getElementById('status-filter').addEventListener('change', loadTickets);

    // ── Init ──────────────────────────────────────────────────────────────────
    loadTickets();
  </script>

  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
</body>
</html>
